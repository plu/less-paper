[env]
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_ENV_HINTS = "1"
HOMEBREW_NO_INSTALL_CLEANUP = "1"

[hooks]
postinstall = "brew bundle"

[tools]
"aqua:tuist" = "4.203.4"
git-lfs = "3.7.1"
"github:a7ex/xcresultparser" = "2.2.0"
"github:abiosoft/colima" = "0.10.3"
"github:jdx/aube" = "1.38.0"
"github:jdx/fnox" = "1.32.0"
"github:lima-vm/lima" = "2.2.0"
"github:nicklockwood/swiftformat" = "0.62.1"
"github:realm/swiftlint" = "0.65.0"
node = "26.7.0"
"spm:mono0926/LicensePlist" = "3.28.0"
swiftlint = "0.65.0"

[settings]
experimental = true
