name: Screenshots - Frame

# Cheap: it renders the committed captures and never launches a simulator, so it runs on every pull
# request that touches the layout or the captions, which is what makes a copy change reviewable.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Modules/MarketingKit/**
      - Modules/MarketingKitTests/**
      - Screenshots/Captures/**
      - Shared/Framework/Resources/Localizable.xcstrings

# One runner, and a push while a run is queued makes the queued one pointless - it would render an
# older commit. Frame only: cancelling Record would throw away an hour, and cancelling Upload could
# leave the listing half-written.
concurrency:
  group: screenshots-frame-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  frame:
    name: Frame
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          lfs: true

      - name: mise
        uses: jdx/mise-action@v3
        with:
          cache: false
          cache_save: false

      - run: mise ci:clean

      - run: mise ci:screenshots:frame

      - name: Contact sheet
        run: |
          python3 Screenshots/contact_sheet.py \
            --input fastlane/screenshots --output "$RUNNER_TEMP/sheet.png" > "$RUNNER_TEMP/table.md"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fastlane/screenshots/*/*_framed.png
            ${{ runner.temp }}/sheet.png
          retention-days: 14
          if-no-files-found: warn

      # The images cannot be shown inline here. GitHub's summary sanitiser strips the src from a
      # data: URI - verified against its Markdown API, which leaves <img> with no src at all - and
      # embedding by URL needs a committed file, while these are generated by design. Record commits
      # its captures, so Record does show them.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Screenshots"
            cat "$RUNNER_TEMP/table.md"
            echo
            echo "The contact sheet and all 28 images are in this run's artifact."
          } >> "$GITHUB_STEP_SUMMARY"
