[env]
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_ENV_HINTS = "1"
HOMEBREW_NO_INSTALL_CLEANUP = "1"

# Ruby takes its default external encoding from the locale, so with LANG unset it reads files as
# US-ASCII and fastlane dies on the first umlaut in the German App Store listing - which is what
# broke the 3.0.4 release, on metadata that had been valid UTF-8 and unchanged in shape for three
# releases. Declared here rather than in the workflow because it is fastlane that needs it, not
# GitHub Actions: a workflow-level fix would leave `mise run metadata:upload` broken locally, which
# is how it reached CI unnoticed.
LANG = "en_US.UTF-8"

# The simulator every test suite and the marketing render run on, declared once so the run and the
# `simulators:prepare` that creates it cannot drift apart.
#
# The iOS version is pinned rather than "whatever is newest", and it tracks Tuist.swift's
# compatibleXcodeVersions - Xcode 27.0 ships iOS 27.0, so the two move together. The snapshot tests
# compare against images recorded on this runtime: a machine carrying a newer one must not quietly
# render on it, because every view test would go red for a reason nobody would look for here.
TEST_SIMULATOR = "iPhone 17 Pro"
TEST_SIMULATOR_OS = "27.0"

[hooks]
postinstall = "brew bundle"

[tools]
xcbeautify = "3.2.1"
tuist = "4.209.0"
git-lfs = "3.8.0"
xcresultparser = "2.2.0"
colima = "0.10.3"
# AXe publishes two macOS tarballs per release. The one autodetection picks, the "homebrew"
# variant, ships the binary unsigned because Homebrew ad-hoc signs it on install - mise does not,
# so on Apple silicon the kernel kills `axe` with SIGKILL before main() and the UI automation tools
# in XcodeBuildMCP fail with nothing printed. The "universal" tarball is the same build signed with
# a Developer ID, so it runs straight out of the download.
"github:cameroncooke/axe" = { version = "1.8.0", matching = "universal" }
gh = "2.101.0"
"github:getsentry/XcodeBuildMCP" = "2.7.1"
aube = "2.5.0"
fnox = "1.35.3"
lima = "2.2.0"
swiftformat = "0.63.0"
node = "26.10.0"
ruby = "4.0.7"
"spm:mono0926/LicensePlist" = "3.28.2"
swiftlint = "0.65.1"

[settings]
experimental = true
