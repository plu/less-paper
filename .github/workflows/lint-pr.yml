name: Lint PR
on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  pull-requests: read

concurrency:
  group: conventional-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint-pr:
    name: Lint PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        with:
          requireScope: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
