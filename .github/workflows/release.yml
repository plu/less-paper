name: Release

# Promotes a build that is already on TestFlight to the App Store. It builds and uploads nothing:
# ci.yml does that on every push to main, and this picks one of the builds it produced.
on:
  workflow_dispatch:
    inputs:
      build:
        description: The TestFlight build number to submit (the ci.yml run number)
        type: string
        required: true

# One release at a time, and never cancelled. Same reasoning as ci.yml's upload job: killing a
# submission halfway is worse than waiting.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

# The tasks themselves still honour RELEASE_DRY_RUN and RELEASE_ALLOW_OFF_MAIN for local use -
# `RELEASE_DRY_RUN=true mise run release:tag 141` remains the way to rehearse one. The workflow
# no longer offers them: a dispatched release does the whole thing, every time, the same way.
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          # git show of an older commit, the tag list and the commit range all need real history.
          fetch-depth: 0
          # Framing reads the committed captures.
          lfs: true

      - name: mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          cache_save: false

      - name: Resolve the build
        id: resolve
        run: mise run release:resolve ${{ inputs.build }}

      # The last step that touches nothing. Everything below writes.
      - name: Preflight
        run: fnox exec -P ci -- mise run release:preflight ${{ inputs.build }}

      # Creates the version in App Store Connect when it does not exist yet - deliver is passed
      # app_version with skip_app_version_update off - and uploads the text either way. Nothing
      # can attach to a version that does not exist.
      - name: Upload the listing text and create the version
        run: fnox exec -P ci -- mise run metadata:upload
        env:
          ASC_APP_VERSION: ${{ steps.resolve.outputs.version }}
          # The listing that describes this build, read from the commit that produced it. Without
          # it the text comes from wherever main has got to, while the version comes from the
          # commit — the same mismatch release:resolve exists to prevent.
          ASC_METADATA_SHA: ${{ steps.resolve.outputs.sha }}

      - name: Frame the screenshots
        run: fnox exec -P ci -- mise run ci:screenshots:frame

      - name: Upload the screenshots
        run: fnox exec -P ci -- mise run ci:screenshots:upload

      - name: Submit for review
        run: fnox exec -P ci -- mise run release:submit ${{ inputs.build }}

      - name: Tag and release
        run: mise run release:tag ${{ inputs.build }}

      # Last, so a failure here leaves everything above complete. Skips itself if main has moved
      # past the released version already - a hand bump, or a deliberate minor or major jump.
      - name: Bump the version on main
        run: mise run release:bump ${{ inputs.build }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Build | ${{ inputs.build }} |"
            echo "| Version | ${{ steps.resolve.outputs.version }} |"
            echo "| Commit | ${{ steps.resolve.outputs.sha }} |"
            echo "| Branch | ${{ steps.resolve.outputs.branch }} |"
            echo "| Tag | ${{ steps.resolve.outputs.tag }} |"
          } >> "$GITHUB_STEP_SUMMARY"
