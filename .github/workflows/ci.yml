name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Naming any type replaces the default list, so the three defaults are respelled here. `labeled`
    # is the addition: without it the TestFlight and UITests conditions below are only ever read
    # from events that already happened, so labelling an open pull request does nothing.
    types: [opened, synchronize, reopened, labeled]

# One self-hosted runner, so everything queues. A push while an earlier run is still going makes
# that run pointless - it is testing a commit that has been replaced.
#
# Pull requests only. A run on main is never cancelled: its upload job ships to TestFlight, and
# killing that halfway is worse than waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TUIST_GITHUB_RUN_NUMBER: ${{ github.run_number }}

jobs:
  test_unit:
    # Every label reaches this workflow now, but only the three that change what a job does deserve
    # a run. One guard is enough for all three jobs: test_ui and upload need this one, and a job
    # whose dependency was skipped is skipped too. A push carries no `action`, so main is unaffected.
    #
    # FullTests belongs here for the same reason as the other two: without it, labelling an open
    # pull request would do nothing until the next push, which is exactly when nobody is watching
    # for it.
    if: github.event.action != 'labeled' || github.event.label.name == 'TestFlight' || github.event.label.name == 'UITests' || github.event.label.name == 'FullTests'
    name: Unit Tests
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false
          lfs: true

      - name: mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          cache_save: false

      - run: mise ci:clean

      - run: fnox exec -P ci -- mise ci:lint

      - run: mise simulators:prepare

      # Scoped to this step rather than the workflow, because it lands in every module's Info.plist
      # and so in every module's cache hash. At workflow level it also reached `ci:cache` below,
      # which warmed the whole graph under a hash no developer's `tuist generate` ever asks for.
      - run: fnox exec -P ci -- mise ci:test:unit
        env:
          TUIST_PAPERLESS_TEST_URL: http://192.168.64.1:9000
          # Selective testing runs only the modules whose fingerprint changed. FullTests turns that
          # off for this run without touching which jobs run - pair it with UITests to get
          # genuinely everything.
          FULL_TEST_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'FullTests') }}

      # The one thing in this repository that reports to the pull request conversation rather than
      # to the run that produced it. A step summary on a green check is something nobody opens, and
      # the audience here is a reviewer who was not looking for coverage.
      #
      # Runs even when the tests failed, so the comment always describes the current head. The
      # report accumulates rather than being rebuilt: selective testing means one push measures one
      # module, and a table showing only that module would read as if the rest had gone unmeasured.
      # A carried row is still true for this head - a module is skipped precisely because nothing it
      # depends on moved - and a push that does move it replaces its row.
      #
      # continue-on-error: whether the job is green is entirely a question of whether the tests
      # passed, never of whether the comment could be posted. A fork pull request gets a read-only
      # GITHUB_TOKEN no matter what `permissions:` says, so the POST 403s there every time - and a
      # transient API error must not turn a green test run red either.
      - name: Coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: mise ci:coverage
        env:
          COVERAGE_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-unit.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - run: fnox exec -P ci -- mise ci:cache
        if: github.ref == 'refs/heads/main'

  test_ui:
    # The XCUITest targets dominate the run, so they are reserved for main, for anything about to
    # ship to TestFlight, and for PRs that ask for them.
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'TestFlight') || contains(github.event.pull_request.labels.*.name, 'UITests')
    name: UI Tests
    needs: [test_unit]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false
          lfs: true

      - name: mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          cache_save: false

      - run: mise ci:clean

      - run: mise simulators:prepare

      # See the note on ci:test:unit for why this is not workflow-level.
      - run: fnox exec -P ci -- mise ci:test:ui
        env:
          TUIST_PAPERLESS_TEST_URL: http://192.168.64.1:9000
          FULL_TEST_RUN: ${{ contains(github.event.pull_request.labels.*.name, 'FullTests') }}

      # A failing XCUITest records the app's accessibility hierarchy and a video at the moment it
      # gave up. Without the bundle a UI failure reports only which assertion failed, which is
      # rarely enough to tell a wrong query from a real regression.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-ui.xcresult
          retention-days: 7
          if-no-files-found: ignore

  upload:
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'TestFlight')
    name: Upload
    needs: [test_unit, test_ui]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false
          lfs: true

      # Inline rather than `mise ci:clean`, because mise is installed by the step below this one.
      # `git lfs checkout` is not optional after the reset — see mise/tasks/ci/clean for why.
      - run: git clean -ffdx -e Tuist/.build && git reset --hard HEAD && git lfs checkout

      - name: mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          cache_save: false

      # Release is the one configuration the two test jobs never compile, so a warning that only
      # shows up under optimisation has nowhere else to be caught. The price is that it can block an
      # upload — which is the trade this flag exists to make.
      - run: fnox exec -P ci -- mise ci:build

      - run: fnox exec -P ci -- mise ci:upload
