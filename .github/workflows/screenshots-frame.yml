name: Screenshots - Frame

# Cheap: it renders the committed captures and never launches a simulator, so it runs on every pull
# request that touches the layout or the captions, which is what makes a copy change reviewable.
on:
  workflow_dispatch:
  pull_request:
    paths:
      # The captions live in Modules/MarketingKit/Resources/Localizable.xcstrings, so the
      # MarketingKit entry already covers a copy change. There is no shared catalogue to watch.
      - Modules/MarketingKit/**
      - Modules/MarketingKitTests/**
      - Screenshots/Captures/**

# One runner, and a push while a run is queued makes the queued one pointless - it would render an
# older commit. Frame only: cancelling Record would throw away an hour, and cancelling Upload could
# leave the listing half-written.
concurrency:
  group: screenshots-frame-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  frame:
    name: Frame
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false
          lfs: true

      - name: mise
        uses: jdx/mise-action@v4
        with:
          cache: false
          cache_save: false

      - run: mise ci:clean

      - run: fnox exec -P ci -- mise ci:screenshots:frame

      - name: Contact sheet
        run: |
          python3 Screenshots/contact_sheet.py \
            --input fastlane/screenshots --output "$RUNNER_TEMP/sheet.png" > "$RUNNER_TEMP/table.md"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fastlane/screenshots/*/*_framed.png
            ${{ runner.temp }}/sheet.png
          retention-days: 14
          if-no-files-found: warn

      # The images cannot be shown inline here. GitHub's summary sanitiser strips the src from a
      # data: URI - verified against its Markdown API, which leaves <img> with no src at all - and
      # embedding by URL needs a committed file, while these are generated by design. Record commits
      # its captures, so Record does show them.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Screenshots"
            # `if: always()` means this also runs after a failed framing step, which never wrote a
            # table. Under `set -euo pipefail` the missing file fails this step too, so the run
            # reports a second, invented failure stacked on the real one.
            if [ -f "$RUNNER_TEMP/table.md" ]; then
              cat "$RUNNER_TEMP/table.md"
            else
              echo "_No table — the framing step did not get far enough to write one._"
            fi
            echo
            # Counted, not stated. As a literal this went stale the moment a screen was added.
            count=$(find fastlane/screenshots -name '*_framed.png' 2>/dev/null | wc -l | tr -d ' ')
            echo "The contact sheet and all $count images are in this run's artifact."
          } >> "$GITHUB_STEP_SUMMARY"
