name: Screenshots - Frame

# Cheap: it renders the committed captures and never launches a simulator, so it runs on every pull
# request that touches the layout or the captions, which is what makes a copy change reviewable.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Modules/MarketingKit/**
      - Modules/MarketingKitTests/**
      - Screenshots/Captures/**
      - Shared/Framework/Resources/Localizable.xcstrings

permissions:
  contents: read

defaults:
  run:
    shell: /bin/bash --noprofile --norc -euo pipefail {0}

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  frame:
    name: Frame
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          lfs: true

      - name: mise
        uses: jdx/mise-action@v3
        with:
          cache: false
          cache_save: false

      - run: mise ci:clean

      - run: mise ci:screenshots:frame

      # TEMPORARY. Settles whether a data: URI survives GitHub's summary sanitiser, which decides
      # how all three workflows show their images. Delete once the answer is recorded.
      - name: data URI probe
        run: |
          printf '### data URI probe\n<img src="data:image/png;base64,%s" width="120">\n' \
            "$(magick -size 120x60 xc:teal png:- | base64)" >> "$GITHUB_STEP_SUMMARY"

      - name: Contact sheet
        run: |
          python3 Screenshots/contact_sheet.py \
            --input fastlane/screenshots --output "$RUNNER_TEMP/sheet.png" > "$RUNNER_TEMP/table.md"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fastlane/screenshots/*/*_framed.png
            ${{ runner.temp }}/sheet.png
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## Screenshots"
            cat "$RUNNER_TEMP/table.md"
            echo
            echo "The contact sheet is in the run's artifact."
          } >> "$GITHUB_STEP_SUMMARY"
