# Paperless behind Apache + mod_auth_openidc + Keycloak, as described in issue #134.
#
# Apache speaks plain HTTP here; Caddy in front terminates TLS with the same internal CA the
# Authelia stack uses, so the simulator only has to trust one CA. Everything about authentication
# is Apache's.
#
# Two -D switches (APACHE_ARGUMENTS in docker-compose.apache-oidc.yml) select the variant:
#
#   -D API_EXEMPT      The reporter's workaround: /api skips OIDC entirely. Paperless then answers
#                      403 "Authentication credentials were not provided" and the app never learns
#                      a proxy login exists.
#   -D FORCE_REDIRECT  Redirect non-browser requests to Keycloak too. Without it mod_auth_openidc
#                      answers anything that does not Accept text/html with a bare 401, which the
#                      app cannot tell from a wrong password.

<VirtualHost *:80>
    ServerName https://paperless.local.plunien.com:8300
    UseCanonicalName On

    # No discovery: the issuer and authorization endpoint are the public URLs the simulator sees
    # (port 8300), while the back-channel calls go to Caddy on 443 inside Docker, where it carries
    # the auth.local.plunien.com alias. mod_auth_openidc refuses plain-http endpoints, hence Caddy
    # rather than keycloak:8080, and Caddy's internal CA is not in this container's trust store,
    # hence OIDCSSLValidateServer Off. Development only.
    OIDCProviderIssuer https://auth.local.plunien.com:8300/realms/paperless
    OIDCProviderAuthorizationEndpoint https://auth.local.plunien.com:8300/realms/paperless/protocol/openid-connect/auth
    OIDCProviderTokenEndpoint https://auth.local.plunien.com/realms/paperless/protocol/openid-connect/token
    OIDCProviderTokenEndpointAuth client_secret_basic
    OIDCProviderJwksUri https://auth.local.plunien.com/realms/paperless/protocol/openid-connect/certs
    OIDCProviderUserInfoEndpoint https://auth.local.plunien.com/realms/paperless/protocol/openid-connect/userinfo

    OIDCSSLValidateServer Off

    OIDCClientID paperless
    # Development-only, matches docker/keycloak/paperless-realm.json.
    OIDCClientSecret development-only-client-secret
    OIDCCryptoPassphrase development-only-passphrase
    OIDCRedirectURI https://paperless.local.plunien.com:8300/oidc/redirect
    OIDCScope "openid profile email"
    OIDCRemoteUserClaim preferred_username

    <IfDefine FORCE_REDIRECT>
        OIDCUnAuthAction auth true
    </IfDefine>

    <Location />
        AuthType openid-connect
        Require valid-user
    </Location>

    <IfDefine API_EXEMPT>
        <Location "/api">
            AuthType None
            AuthMerging Off
            Require all granted
        </Location>
    </IfDefine>

    # Never trust a client-sent identity; inject the one mod_auth_openidc established. Empty on the
    # exempt /api, which paperless treats as anonymous.
    RequestHeader unset Remote-User early
    RequestHeader set Remote-User "expr=%{REMOTE_USER}"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto https
    ProxyPass /oidc/redirect !
    ProxyPass / http://paperless:8000/
    ProxyPassReverse / http://paperless:8000/

    LogLevel warn auth_openidc:info
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
