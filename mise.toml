[env]
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_ENV_HINTS = "1"
HOMEBREW_NO_INSTALL_CLEANUP = "1"

# The simulator every test suite and the marketing render run on, declared once so the run and the
# `simulators:prepare` that creates it cannot drift apart.
#
# The iOS version is pinned rather than "whatever is newest", and it tracks Tuist.swift's
# compatibleXcodeVersions - Xcode 26.5 ships iOS 26.5, so the two move together. The snapshot tests
# compare against images recorded on this runtime: a machine carrying a newer one must not quietly
# render on it, because every view test would go red for a reason nobody would look for here.
TEST_SIMULATOR = "iPhone 17 Pro"
TEST_SIMULATOR_OS = "26.5"

[hooks]
postinstall = "brew bundle"

[tools]
"aqua:tuist" = "4.205.0"
git-lfs = "3.8.0"
"github:a7ex/xcresultparser" = "2.2.0"
"github:abiosoft/colima" = "0.10.3"
"github:jdx/aube" = "2.2.4"
"github:jdx/fnox" = "1.34.1"
"github:lima-vm/lima" = "2.2.0"
"github:nicklockwood/swiftformat" = "0.63.0"
"github:realm/swiftlint" = "0.65.1"
node = "26.8.1"
ruby = "3.4.10"
"spm:mono0926/LicensePlist" = "3.28.0"
swiftlint = "0.65.1"
tuist = "4.206.0"

[settings]
experimental = true
